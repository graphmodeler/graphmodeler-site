<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-label="Rows of data on top become a graph below">
  <title>Rows of data become a graph</title>
  <style>
    .a{animation-duration:13.2s;animation-iteration-count:infinite;animation-timing-function:ease-out;transform-box:fill-box;transform-origin:center}
    .l{transform-origin:left center}
    @keyframes k0{0%,3.79%{opacity:0;transform:scale(0.55)}5.68%{opacity:1;transform:scale(1.12)}6.82%{transform:scale(1)}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k1{0%,5.30%{opacity:1;transform:scaleX(0)}8.33%{transform:scaleX(1)}93.94%{opacity:1;transform:scaleX(1)}97.73%,100%{opacity:0;transform:scaleX(1)}}
    @keyframes k2{0%,8.71%{opacity:0}10.98%{opacity:1}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k3{0%,11.36%{opacity:0;transform:scale(0.55)}13.26%{opacity:1;transform:scale(1.12)}14.39%{transform:scale(1)}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k4{0%,22.73%{opacity:0;transform:scale(0.55)}24.62%{opacity:1;transform:scale(1.12)}25.76%{transform:scale(1)}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k5{0%,24.24%{opacity:1;transform:scaleX(0)}27.27%{transform:scaleX(1)}93.94%{opacity:1;transform:scaleX(1)}97.73%,100%{opacity:0;transform:scaleX(1)}}
    @keyframes k6{0%,27.65%{opacity:1;transform:scaleX(0)}30.68%{transform:scaleX(1)}93.94%{opacity:1;transform:scaleX(1)}97.73%,100%{opacity:0;transform:scaleX(1)}}
    @keyframes k7{0%,31.06%{opacity:0}33.33%{opacity:1}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k8{0%,33.71%{opacity:1;stroke-dashoffset:100}35.61%{stroke-dashoffset:0}93.94%{opacity:1;stroke-dashoffset:0}97.73%,100%{opacity:0;stroke-dashoffset:0}}
    @keyframes k9{0%,35.23%{opacity:0}36.36%{opacity:1}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k10{0%,35.98%{opacity:0;transform:scale(0.55)}37.88%{opacity:1;transform:scale(1.12)}39.02%{transform:scale(1)}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k11{0%,41.67%{opacity:0;transform:scale(0.55)}43.56%{opacity:1;transform:scale(1.12)}44.70%{transform:scale(1)}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k12{0%,43.18%{opacity:1;transform:scaleX(0)}46.21%{transform:scaleX(1)}93.94%{opacity:1;transform:scaleX(1)}97.73%,100%{opacity:0;transform:scaleX(1)}}
    @keyframes k13{0%,46.59%{opacity:0}48.86%{opacity:1}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k14{0%,49.24%{opacity:0;transform:scale(0.55)}51.14%{opacity:1;transform:scale(1.12)}52.27%{transform:scale(1)}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k15{0%,60.61%{opacity:0;transform:scale(0.55)}62.50%{opacity:1;transform:scale(1.12)}63.64%{transform:scale(1)}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k16{0%,62.12%{opacity:1;transform:scaleX(0)}65.15%{transform:scaleX(1)}93.94%{opacity:1;transform:scaleX(1)}97.73%,100%{opacity:0;transform:scaleX(1)}}
    @keyframes k17{0%,65.53%{opacity:1;transform:scaleX(0)}68.56%{transform:scaleX(1)}93.94%{opacity:1;transform:scaleX(1)}97.73%,100%{opacity:0;transform:scaleX(1)}}
    @keyframes k18{0%,68.94%{opacity:0}71.21%{opacity:1}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k19{0%,71.59%{opacity:1;stroke-dashoffset:100}73.86%{stroke-dashoffset:0}93.94%{opacity:1;stroke-dashoffset:0}97.73%,100%{opacity:0;stroke-dashoffset:0}}
    @keyframes k20{0%,73.48%{opacity:0}74.62%{opacity:1}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k21{0%,75.76%{opacity:0}78.03%{opacity:1}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @keyframes k22{0%,78.79%{opacity:1;stroke-dashoffset:100}81.06%{stroke-dashoffset:0}93.94%{opacity:1;stroke-dashoffset:0}97.73%,100%{opacity:0;stroke-dashoffset:0}}
    @keyframes k23{0%,80.68%{opacity:0}81.82%{opacity:1}93.94%{opacity:1}97.73%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.a{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
  </style>
  <rect x="12" y="12" width="456" height="456" rx="32" fill="#1b1f24" stroke="#3a414b" stroke-width="2"/>

  <!-- The rows: a grid, with a dot for the kind of each row and a pill for its style. A part with a data-p name is animated by make-hero.mjs. -->
  <rect x="40" y="40" width="400" height="170" rx="14" fill="#22272e" stroke="#3a414b" stroke-width="2"/>
  <rect x="88" y="53" width="70" height="8" rx="4" fill="#5b6470"/>
  <rect x="210" y="53" width="70" height="8" rx="4" fill="#5b6470"/>
  <rect x="340" y="53" width="60" height="8" rx="4" fill="#5b6470"/>
  <line x1="40" y1="76" x2="440" y2="76" stroke="#3a414b" stroke-width="2"/>

  <!-- Row 1, a cluster (teal): the cluster box and its nodes appear together -->
  <circle class="a" style="animation-name:k0" cx="62" cy="100" r="7" fill="#2cc4a8"/>
  <rect class="a l" style="animation-name:k1" x="88" y="95" width="90" height="10" rx="5" fill="#9aa3af"/>
  <rect class="a" style="animation-name:k2" x="340" y="91" width="80" height="18" rx="9" fill="#17433d"/>

  <!-- Row 2, an edge (orange): an arrow, and the node at its end -->
  <circle class="a" style="animation-name:k4" cx="62" cy="130" r="7" fill="#f59a23"/>
  <rect class="a l" style="animation-name:k5" x="88" y="125" width="78" height="10" rx="5" fill="#9aa3af"/>
  <rect class="a l" style="animation-name:k6" x="210" y="125" width="72" height="10" rx="5" fill="#9aa3af"/>
  <rect class="a" style="animation-name:k7" x="340" y="121" width="80" height="18" rx="9" fill="#4a3513"/>

  <!-- Row 3, a node (blue): the database -->
  <circle class="a" style="animation-name:k11" cx="62" cy="160" r="7" fill="#4a93e8"/>
  <rect class="a l" style="animation-name:k12" x="88" y="155" width="102" height="10" rx="5" fill="#9aa3af"/>
  <rect class="a" style="animation-name:k13" x="340" y="151" width="80" height="18" rx="9" fill="#1e3a5f"/>

  <!-- Row 4, an edge (orange): three more arrows -->
  <circle class="a" style="animation-name:k15" cx="62" cy="190" r="7" fill="#f59a23"/>
  <rect class="a l" style="animation-name:k16" x="88" y="185" width="78" height="10" rx="5" fill="#9aa3af"/>
  <rect class="a l" style="animation-name:k17" x="210" y="185" width="72" height="10" rx="5" fill="#9aa3af"/>
  <rect class="a" style="animation-name:k18" x="340" y="181" width="80" height="18" rx="9" fill="#4a3513"/>

  <!-- The graph -->
  <rect x="40" y="254" width="400" height="186" rx="14" fill="#22272e" stroke="#3a414b" stroke-width="2"/>

  <!-- Row 1: the cluster, a node on its own, and two nodes inside the cluster, all at once -->
  <rect class="a" style="animation-name:k3" x="262" y="292" width="162" height="134" rx="14" fill="#1b1f24" stroke="#6b7a86" stroke-width="2.5"/>
  <rect class="a" style="animation-name:k3" x="56" y="330" width="76" height="40" rx="12" fill="#12313a" stroke="#2cb5d1" stroke-width="2.5"/>
  <rect class="a" style="animation-name:k3" x="276" y="306" width="72" height="36" rx="10" fill="#12313a" stroke="#2cb5d1" stroke-width="2.5"/>
  <rect class="a" style="animation-name:k3" x="340" y="368" width="72" height="36" rx="10" fill="#12313a" stroke="#2cb5d1" stroke-width="2.5"/>

  <!-- Row 2: an arrow, and the decision at its end -->
  <line class="a" pathLength="100" stroke-dasharray="100" style="animation-name:k8" x1="132" y1="350" x2="148" y2="350" stroke="#2cb5d1" stroke-width="2.5"/>
  <polygon class="a" style="animation-name:k9" points="160,350 147,343.5 147,356.5" fill="#2cb5d1"/>
  <polygon class="a" style="animation-name:k10" points="160,350 196,322 232,350 196,378" fill="#3b2f12" stroke="#f0b45a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Row 3: the database, one part so that it pops as one -->
  <g class="a" style="animation-name:k14">
    <path d="M170 268 V290 A26 8 0 0 0 222 290 V268" fill="#2b313a" stroke="#9aa3af" stroke-width="2.5"/>
    <ellipse cx="196" cy="268" rx="26" ry="8" fill="#2b313a" stroke="#9aa3af" stroke-width="2.5"/>
  </g>

  <!-- Row 4: an arrow into the cluster, a dashed one to the database, and one inside the cluster -->
  <line class="a" pathLength="100" stroke-dasharray="100" style="animation-name:k19" x1="232" y1="350" x2="265.4" y2="330.1" stroke="#2cb5d1" stroke-width="2.5"/>
  <polygon class="a" style="animation-name:k20" points="274,325 267.9,334.4 262.9,325.8" fill="#2cb5d1"/>
  <g class="a" style="animation-name:k21">
    <line x1="196" y1="322" x2="196" y2="311" stroke="#9aa3af" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="196,299 190.5,311 201.5,311" fill="#9aa3af"/>
  </g>
  <path class="a" pathLength="100" stroke-dasharray="100" style="animation-name:k22" d="M312 342 V386 H328" fill="none" stroke="#2cb5d1" stroke-width="2.5"/>
  <polygon class="a" style="animation-name:k23" points="340,386 327,379.5 327,392.5" fill="#2cb5d1"/>
</svg>
