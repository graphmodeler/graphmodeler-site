<!DOCTYPE html>
<html class="dark">
<head>
<meta charset="UTF-8">
<title></title>
<style>
/* The colors are the app's own, under the app's names. The app marks the page dark; a page that is not marked is light. */
:root {
    color-scheme: light;
    --rv-bg: #ffffff; --rv-surface: #ffffff; --rv-text: #000000; --rv-text-2: #6b7280;
    --rv-border: #d1d5db; --rv-control-border: #9ca3af; --rv-control-bg: #f3f4f6; --rv-control-hover: #e5e7eb;
    --rv-icon: #374151; --rv-accent: #1d4ed8; --rv-accent-bg: #dbeafe; --rv-banner: #f3f4f6; --rv-shadow: rgb(0 0 0 / 15%);
    --rv-error-text: #991b1b; --rv-error-bg: #fee2e2;
    --rv-syn-attribute: #a1260d; --rv-syn-string: #0a7c2f; --rv-syn-number: #1a56db; --rv-syn-keyword: #9b1bb3; --rv-syn-punctuation: #555555;
    --v-match: #fff6b0; --v-current: #ffcf40;
}
html.dark {
    color-scheme: dark;
    --rv-bg: #1b1f24; --rv-surface: #22272e; --rv-text: #e6e8eb; --rv-text-2: #9aa3af;
    --rv-border: #3a414b; --rv-control-border: #5b6470; --rv-control-bg: #2b313a; --rv-control-hover: #373e48;
    --rv-icon: #cbd5e1; --rv-accent: #6ea8fe; --rv-accent-bg: #1e3a5f; --rv-banner: #2b313a; --rv-shadow: rgb(0 0 0 / 50%);
    --rv-error-text: #f0625f; --rv-error-bg: #3a1f22;
    --rv-syn-attribute: #f0846f; --rv-syn-string: #5fd18a; --rv-syn-number: #6ea8fe; --rv-syn-keyword: #d79bef; --rv-syn-punctuation: #9aa3af;
    --v-match: #4a4320; --v-current: #7a6212;
}
html, body { height: 100%; margin: 0; }
body {
    font: 13px/1.4 system-ui, sans-serif;
    background: var(--rv-bg);
    color: var(--rv-text);
    display: flex;
    flex-direction: column;
}
svg { fill: currentColor; }

/* ---- The row of controls: groups of icon buttons with a thin line between them, as in the app ---- */
#toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.3rem;
    padding: 0.4rem 0.6rem;
    border-bottom: 1px solid var(--rv-border);
    flex: 0 0 auto;
}
.group { display: flex; align-items: center; gap: 0.25rem; }
.sep { flex: none; align-self: stretch; width: 1px; min-height: 1.4rem; margin: 0 0.4rem; background: var(--rv-border); }
#searchInput {
    box-sizing: border-box;
    height: 1.9rem;
    width: 12rem;
    padding: 0.2rem 0.5rem;
    border: 1px solid var(--rv-control-border);
    border-radius: 4px;
    background: var(--rv-bg);
    color: var(--rv-text);
    font: inherit;
}
.ib {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    min-width: 1.9rem;
    height: 1.9rem;
    padding: 0;
    border: 1px solid var(--rv-control-border);
    border-radius: 4px;
    background: var(--rv-control-bg);
    color: var(--rv-icon);
    cursor: pointer;
}
.ib:hover { background: var(--rv-control-hover); }
.ib.on { border-color: var(--rv-accent); background: var(--rv-accent-bg); color: var(--rv-accent); }
.ib svg { width: 1.3rem; height: 1.3rem; }
.ib.menuBtn { padding: 0 0.15rem 0 0.35rem; }
.ib.menuBtn svg + svg { width: 1rem; height: 1rem; }
.ib:focus-visible, #searchInput:focus-visible, .menu button:focus-visible { outline: 2px solid var(--rv-accent); outline-offset: 1px; }
#matchCount { min-width: 3.2rem; padding: 0 0.3rem; color: var(--rv-text-2); font-variant-numeric: tabular-nums; }
/* Help is for a page that the app shows: the app marks the page (data-help), and a page on a website has no help button. */
.helpOnly { display: none; }
html[data-help] .helpOnly { display: inline-flex; }
html[data-help] .sep.helpOnly { display: block; }
/* The app searches the page with its own search bar (data-app-search), so the page's own box and buttons are not shown there. */
html[data-app-search] .searchOwn { display: none; }

/* ---- The menus of Copy and Save ---- */
.menuWrap { position: relative; }
.menu {
    display: none;
    position: absolute;
    z-index: 10;
    top: 100%;
    left: 0;
    flex-direction: column;
    min-width: max-content;
    margin-top: 0.2rem;
    padding: 0.25rem;
    border: 1px solid var(--rv-control-border);
    border-radius: 4px;
    background: var(--rv-surface);
    box-shadow: 0 4px 10px var(--rv-shadow);
}
.menu.open { display: flex; }
.menu button {
    padding: 0.35rem 0.7rem;
    border: 0;
    border-radius: 3px;
    background: none;
    color: var(--rv-text);
    font: inherit;
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
}
.menu button:hover { background: var(--rv-control-hover); }

#errorBanner {
    display: none;
    padding: 0.4rem 0.6rem;
    background: var(--rv-error-bg);
    color: var(--rv-error-text);
    border-bottom: 1px solid var(--rv-border);
    flex: 0 0 auto;
}

/* ---- The counts, along the bottom: an icon and a number, the name in the tooltip ---- */
#statsBar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.2rem 1.1rem;
    padding: 0.3rem 0.6rem;
    border-top: 1px solid var(--rv-border);
    color: var(--rv-text-2);
    font-size: 12px;
    flex: 0 0 auto;
}
.stat { display: inline-flex; align-items: center; gap: 0.3rem; font-variant-numeric: tabular-nums; }
.stat svg { width: 1.05rem; height: 1.05rem; }

/* ---- Raw (virtualized) view ---- */
#scrollArea {
    position: relative;
    overflow: auto;
    flex: 1 1 auto;
    min-height: 0;
    background: var(--rv-surface);
    font: 13px ui-monospace, Consolas, "Courier New", monospace;
}
#sizer { position: relative; }
.row { position: absolute; left: 0; top: 0; white-space: pre; height: 18px; line-height: 18px; }
.rowNum {
    display: inline-block;
    width: 50px;
    text-align: right;
    padding-right: 8px;
    color: var(--rv-text-2);
    background: var(--rv-banner);
    user-select: none;
}
.rowText { padding-left: 6px; }
.row.matchRow .rowText { background: var(--v-match); }
.row.currentMatchRow .rowText { background: var(--v-current); }
mark { background: var(--v-current); color: inherit; padding: 0; }

/* Syntax highlight colors */
.jkey { color: var(--rv-syn-attribute); font-weight: bold; }
.jstr { color: var(--rv-syn-string); }
.jnum { color: var(--rv-syn-number); }
.jbool { color: var(--rv-syn-keyword); }
.jpunc { color: var(--rv-syn-punctuation); }

/* ---- Tree view ---- */
#treeView {
    display: none;
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    background: var(--rv-surface);
    padding: 8px 10px;
    font: 13px ui-monospace, Consolas, "Courier New", monospace;
}
.treeNode { margin-left: 16px; }
.treeLine { border-radius: 2px; }
.treeLine.treeCurrent { background: var(--v-match); }
.toggle { cursor: pointer; display: inline-block; width: 14px; height: 14px; vertical-align: middle; user-select: none; position: relative; }
.toggle::before {
    content: "";
    position: absolute;
    left: 3px;
    top: 2px;
    width: 5px;
    height: 5px;
    border: solid var(--rv-text-2);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
}
.toggle.collapsed::before { left: 1px; top: 4px; transform: rotate(-45deg); }
.treeKey { color: var(--rv-syn-attribute); }
.treeVal.jstr { color: var(--rv-syn-string); }
.treeVal.jnum { color: var(--rv-syn-number); }
.treeVal.jbool { color: var(--rv-syn-keyword); }
.moreLink { color: var(--rv-syn-number); cursor: pointer; text-decoration: underline; }
.treeError { color: var(--rv-error-text); }
</style>
</head>

<script>
/* =====================================================================
   Knowledge Graph viewer
   ===================================================================== */

var ROW_HEIGHT = 18;
var BUFFER_ROWS = 8;

var originalJson = "";
var prettyJson = "";
var lines = [];
var parsedOk = false;
var parsedObj = null;

var matchCase = false;   // set by the app's search bar; the page's own box never matches the case
// The page is shown by the app, which has a search bar of its own: it sends the term and the page says how many matches there are.
var APP_SEARCH = document.documentElement.hasAttribute("data-app-search");

var matchLines = [];   // indices into lines that contain the search term
var currentMatch = -1;
var currentTerm = "";

// The same search, in the tree view: the matches are the rows of the tree whose key or value has the term, found in the data
// and kept as paths (the position of the row among its brothers, from the top), so that a row that is folded away, or past the
// first rows of a long list, can still be found and shown.
var rawView = true;
var treeMatches = [];
var treeCurrent = -1;
var treeTerm = "";

var LABELS = {};

// ---------- text ----------
function L(key) {
    return Object.prototype.hasOwnProperty.call(LABELS, key) ? String(LABELS[key]) : key;
}

// Puts {name} values into a piece of text in one pass, so that nothing in a value is read as a pattern.
function fill(text, values) {
    return text.replace(/\{(\w+)\}/g, function (whole, name) {
        return Object.prototype.hasOwnProperty.call(values, name) ? String(values[name]) : whole;
    });
}

// Gives every element that names its text (data-l) that text: as its own text, or as the attributes data-a lists.
// A name that ends in a colon in the labels ("Characters:") is a tooltip here, without the colon.
function applyLabels() {
    document.title = L("JsonViewerTitle");
    var els = document.querySelectorAll("[data-l]");
    for (var i = 0; i < els.length; i++) {
        var text = L(els[i].getAttribute("data-l"));
        var targets = (els[i].getAttribute("data-a") || "text").split(",");
        for (var j = 0; j < targets.length; j++) {
            if (targets[j] === "text") { els[i].textContent = text; }
            else { els[i].setAttribute(targets[j], text.replace(/\s*:\s*$/, "")); }
        }
    }
}

function escHtml(s) {
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

// ---------- load / parse ----------
function loadJson(jsonText) {
    originalJson = jsonText;
    var banner = document.getElementById("errorBanner");
    banner.style.display = "none";

    try {
        parsedObj = JSON.parse(jsonText);
        prettyJson = JSON.stringify(parsedObj, null, 2);
        parsedOk = true;
    } catch (e) {
        parsedObj = null;
        prettyJson = jsonText;
        parsedOk = false;
        banner.style.display = "block";
        banner.textContent = L("JsonViewerCouldParseJson") + " (" + e.message + "). " + L("JsonViewerShowingRawText");
    }

    lines = prettyJson.split("\n");
    matchLines = [];
    currentMatch = -1;
    currentTerm = "";
    treeMatches = [];
    treeCurrent = -1;
    treeTerm = "";
    document.getElementById("matchCount").textContent = "";

    renderStats();
    setupSizer();
    renderVisibleRows();
    renderTree();
}

// Mirrors the estimate the app gives for a Knowledge Graph file, about four characters a token with 8% added.
function getTokenEstimate(charCount) {
    var estimatedTokens = Math.ceil(charCount / 4);
    var safetyBuffer = Math.round(estimatedTokens * 0.08);
    return estimatedTokens + safetyBuffer;
}

function renderStats() {
    document.getElementById("statChars").textContent = String(originalJson.length);
    document.getElementById("statTokens").textContent = String(getTokenEstimate(originalJson.length));
    document.getElementById("statLines").textContent = String(lines.length);
    var hasNodes = parsedOk && parsedObj && typeof parsedObj === "object" && parsedObj.nodes && parsedObj.nodes.length !== undefined;
    var hasEdges = parsedOk && parsedObj && typeof parsedObj === "object" && parsedObj.edges && parsedObj.edges.length !== undefined;
    document.getElementById("statNodesBox").style.display = hasNodes ? "" : "none";
    document.getElementById("statEdgesBox").style.display = hasEdges ? "" : "none";
    if (hasNodes) { document.getElementById("statNodes").textContent = String(parsedObj.nodes.length); }
    if (hasEdges) { document.getElementById("statEdges").textContent = String(parsedObj.edges.length); }
}

// ---------- raw view: virtualized rendering ----------
// Only the rows currently in (or near) the viewport are ever created as
// DOM nodes. This keeps the viewer fast even for JSON far too large for
// an Excel cell (tens of thousands of lines), unlike a one-div-per-line
// render of the whole file.
function setupSizer() {
    var sizer = document.getElementById("sizer");
    sizer.style.height = (lines.length * ROW_HEIGHT) + "px";
}

// The text put in the form a search compares: in lower case, unless the case matters.
function fold(text) { return matchCase ? text : text.toLowerCase(); }

// Where the term is in a line of text, as [start, end) pairs, not overlapping.
function searchRanges(text, term) {
    var ranges = [];
    if (!term) { return ranges; }
    var lower = fold(text);
    var wanted = fold(term);
    var pos = 0;
    var idx;
    while ((idx = lower.indexOf(wanted, pos)) !== -1) {
        ranges.push([idx, idx + term.length]);
        pos = idx + term.length;
    }
    return ranges;
}

// A piece of a line as HTML: the text that starts at position start in the line, with the parts the search found marked, and the whole piece in a
// span of the given class (the color of its kind of token) when there is one. The marks sit inside the span, so the colors stay.
function piece(text, start, ranges, cls) {
    var out = "";
    var pos = 0;
    var end = start + text.length;
    for (var r = 0; r < ranges.length; r++) {
        var a = Math.max(ranges[r][0], start);
        var b = Math.min(ranges[r][1], end);
        if (a >= b) { continue; }
        out += escHtml(text.substring(pos, a - start)) + "<mark>" + escHtml(text.substring(a - start, b - start)) + "</mark>";
        pos = b - start;
    }
    out += escHtml(text.substring(pos));
    return cls ? "<span class=\"" + cls + "\">" + out + "</span>" : out;
}

function syntaxHighlight(lineText) {
    // Very lightweight line-based tokenizer: good enough for pretty-printed
    // JSON.stringify output (one token group per line), not a full parser.
    var ranges = currentTerm ? searchRanges(lineText, currentTerm) : [];
    var html = "";
    var re = /("(?:\\.|[^"\\])*")(\s*:)?|(\btrue\b|\bfalse\b|\bnull\b)|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|([{}\[\],])/g;
    var lastIndex = 0;
    var m;
    while ((m = re.exec(lineText)) !== null) {
        if (m.index > lastIndex) {
            html += piece(lineText.substring(lastIndex, m.index), lastIndex, ranges, "");
        }
        if (m[1]) {
            var cls = m[2] ? "jkey" : "jstr";
            html += piece(m[1], m.index, ranges, cls) + (m[2] ? piece(m[2], m.index + m[1].length, ranges, "") : "");
        } else if (m[3]) {
            html += piece(m[3], m.index, ranges, "jbool");
        } else if (m[4]) {
            html += piece(m[4], m.index, ranges, "jnum");
        } else if (m[5]) {
            html += piece(m[5], m.index, ranges, "jpunc");
        }
        lastIndex = re.lastIndex;
    }
    if (lastIndex < lineText.length) {
        html += piece(lineText.substring(lastIndex), lastIndex, ranges, "");
    }
    return html;
}

// A piece of text of the tree with the term marked (the color of the piece is its element's own).
function highlightSearchTerm(lineText, term) {
    return piece(lineText, 0, searchRanges(lineText, term), "");
}

function renderVisibleRows() {
    var scrollArea = document.getElementById("scrollArea");
    var sizer = document.getElementById("sizer");
    var scrollTop = scrollArea.scrollTop;
    var viewportH = scrollArea.clientHeight || 400;

    var first = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - BUFFER_ROWS);
    var visibleCount = Math.ceil(viewportH / ROW_HEIGHT) + BUFFER_ROWS * 2;
    var last = Math.min(lines.length - 1, first + visibleCount);

    sizer.textContent = "";
    var matchSet = {};
    var i;
    for (i = 0; i < matchLines.length; i++) { matchSet[matchLines[i]] = true; }

    for (i = first; i <= last; i++) {
        var row = document.createElement("div");
        row.className = "row";
        if (matchSet[i]) { row.className += " matchRow"; }
        if (currentMatch !== -1 && matchLines[currentMatch] === i) { row.className += " currentMatchRow"; }
        row.style.top = (i * ROW_HEIGHT) + "px";

        var numSpan = document.createElement("span");
        numSpan.className = "rowNum";
        numSpan.textContent = (i + 1).toString();

        var textSpan = document.createElement("span");
        textSpan.className = "rowText";
        var lineText = lines[i] || "";
        // The colors of the line stay while it is searched: the term is marked inside the colored pieces.
        textSpan.innerHTML = syntaxHighlight(lineText);

        row.appendChild(numSpan);
        row.appendChild(textSpan);
        sizer.appendChild(row);
    }
}

// ---------- search ----------
// One search box for both views. In the raw view the matches are lines; in the tree they are rows of the tree whose key or value has
// the term (not a position in a list, and not the size shown after a key). The count and the place are numbers, so the two views
// may count differently, and a change of view searches again in the new view, keeping the place when the counts are the same.
function runSearch(keep) {
    var term = document.getElementById("searchInput").value;
    if (rawView) {
        currentTerm = term;
        matchLines = [];
        currentMatch = -1;

        if (term) {
            var termFolded = fold(term);
            for (var i = 0; i < lines.length; i++) {
                if (fold(lines[i]).indexOf(termFolded) !== -1) {
                    matchLines.push(i);
                }
            }
            if (matchLines.length > 0) { currentMatch = (keep > 0 && keep < matchLines.length) ? keep : 0; }
        }

        updateMatchCount();
        scrollToCurrentMatch();
        renderVisibleRows();
    } else {
        treeTerm = term;
        treeMatches = term && parsedOk ? collectTreeMatches(term) : [];
        treeCurrent = treeMatches.length > 0 ? ((keep > 0 && keep < treeMatches.length) ? keep : 0) : -1;
        paintTreeText();
        updateMatchCount();
        revealTreeMatch();
    }
}

// The place among the matches and how many there are, as numbers: "3 / 12", or "0" when nothing matches.
function updateMatchCount() {
    var el = document.getElementById("matchCount");
    var term = rawView ? currentTerm : treeTerm;
    var count = rawView ? matchLines.length : treeMatches.length;
    var at = rawView ? currentMatch : treeCurrent;
    reportSearch(term, count, at);
    if (!term) { el.textContent = ""; return; }
    if (count === 0) { el.textContent = "0"; return; }
    el.textContent = (at + 1) + " / " + count;
}

// The app's search bar shows the count: the page tells it how many matches there are and which one it is at (-1 for none).
function reportSearch(term, count, at) {
    if (!APP_SEARCH) { return; }
    window.parent.postMessage({ type: "graph-modeler-viewer", action: "found", count: term ? count : 0, current: term && count > 0 ? at : -1 }, "*");
}

function scrollToCurrentMatch() {
    if (currentMatch === -1) { return; }
    var scrollArea = document.getElementById("scrollArea");
    var targetLine = matchLines[currentMatch];
    var targetTop = targetLine * ROW_HEIGHT - (scrollArea.clientHeight / 2);
    if (targetTop < 0) { targetTop = 0; }
    scrollArea.scrollTop = targetTop;
}

// Go to match number i (counting from 0) in the view that is showing.
function gotoMatch(i) {
    if (rawView) {
        if (matchLines.length === 0) { return; }
        currentMatch = i;
        updateMatchCount();
        scrollToCurrentMatch();
        renderVisibleRows();
    } else {
        if (treeMatches.length === 0) { return; }
        treeCurrent = i;
        updateMatchCount();
        revealTreeMatch();
    }
}

function nextMatch() {
    var count = rawView ? matchLines.length : treeMatches.length;
    if (count === 0) { return; }
    gotoMatch(((rawView ? currentMatch : treeCurrent) + 1) % count);
}

function prevMatch() {
    var count = rawView ? matchLines.length : treeMatches.length;
    if (count === 0) { return; }
    gotoMatch(((rawView ? currentMatch : treeCurrent) - 1 + count) % count);
}

function clearSearch() {
    document.getElementById("searchInput").value = "";
    runSearch(-1);
}

// The rows of the tree that match, in the order of the file, each as the path to it: the position of the row among its brothers at
// every step down from the top.
function collectTreeMatches(term) {
    var out = [];
    var t = fold(term);
    function has(s) { return fold(String(s)).indexOf(t) !== -1; }
    function walk(value, path) {
        var isArr = Array.isArray(value);
        var keys = isArr ? null : Object.keys(value);
        var n = isArr ? value.length : keys.length;
        for (var i = 0; i < n; i++) {
            var child = isArr ? value[i] : value[keys[i]];
            var here = path.concat([i]);
            var container = child !== null && typeof child === "object";
            if ((!isArr && has(keys[i])) || (!container && has(child))) { out.push(here); }
            if (container) { walk(child, here); }
        }
    }
    if (parsedObj !== null && typeof parsedObj === "object") { walk(parsedObj, []); }
    return out;
}

// Show the current match of the tree: open every branch above it (and the rest of a long list, if it is past the first rows),
// mark its row, and scroll it into view.
function revealTreeMatch() {
    var before = document.querySelector(".treeLine.treeCurrent");
    if (before) { before.className = "treeLine"; }
    if (treeCurrent === -1) { return; }
    var path = treeMatches[treeCurrent];
    var node = document.getElementById("treeView").firstChild;
    for (var s = 0; s < path.length; s++) {
        if (!node || !node.treeHolder) { return; }
        node.treeHolder.style.display = "block";
        node.treeToggle.className = "toggle";
        var holder = node.treeHolder;
        var child = holder.children[path[s]];
        if (!child || child.className.indexOf("moreLink") !== -1) {
            var more = holder.lastChild;
            if (more && more.onclick) { more.onclick(); }
            child = holder.children[path[s]];
        }
        node = child;
    }
    if (!node || !node.treeLine) { return; }
    node.treeLine.className = "treeLine treeCurrent";
    if (node.treeLine.scrollIntoView) { node.treeLine.scrollIntoView({ block: "center" }); }
}

// ---------- copy ----------
function copyText(text) {
    var temp = document.createElement("textarea");
    temp.value = text;
    document.body.appendChild(temp);
    temp.select();
    try { document.execCommand("copy"); } catch (e) { /* ignore */ }
    document.body.removeChild(temp);
}

// ---------- tree view ----------
var TREE_ARRAY_LIMIT = 200; // cap initial render of large arrays so huge graphs don't freeze the tree

function renderTree() {
    var container = document.getElementById("treeView");
    container.textContent = "";
    if (!parsedOk) {
        var notice = document.createElement("div");
        notice.className = "treeError";
        notice.textContent = L("JsonViewerTreeNotAvailable");
        container.appendChild(notice);
        return;
    }
    container.appendChild(buildTreeNode("root", parsedObj, true, false));
}

// What a branch holds, in the notation of JSON itself: [7] for a list of seven, {3} for an object with three keys.
function sizeLabel(v) {
    if (Array.isArray(v)) { return "[" + v.length + "]"; }
    return "{" + Object.keys(v).length + "}";
}

// A piece of text of the tree that a search can mark: a key, or a value. The text is kept, and drawn with the term marked when
// the tree is being searched.
function markableText(text) {
    var el = document.createElement("span");
    el.setAttribute("data-m", "1");
    el.treeText = text;
    paintMarkable(el);
    return el;
}

function paintMarkable(el) {
    if (treeTerm && !rawView) { el.innerHTML = highlightSearchTerm(el.treeText, treeTerm); }
    else { el.textContent = el.treeText; }
}

// Draw again every piece of text that was made so far, for a new search term (or for none).
function paintTreeText() {
    var els = document.querySelectorAll("#treeView [data-m]");
    for (var i = 0; i < els.length; i++) { paintMarkable(els[i]); }
}

// A row of the tree and what is under it. named is true for the key of an object, which a search can match, and false for the
// place in a list, which it cannot. The row remembers its parts (treeLine, treeHolder, treeToggle) so that a search can open it.
function buildTreeNode(key, value, isRoot, named) {
    var wrap = document.createElement("div");
    wrap.className = "treeNode";

    var isContainer = value !== null && typeof value === "object";

    var line = document.createElement("div");
    line.className = "treeLine";
    wrap.treeLine = line;
    if (isContainer) {
        var toggle = document.createElement("span");
        toggle.className = "toggle";
        var childHolder = document.createElement("div");
        wrap.treeHolder = childHolder;
        wrap.treeToggle = toggle;

        toggle.onclick = (function (t, holder) {
            return function () {
                var collapsed = holder.style.display === "none";
                holder.style.display = collapsed ? "block" : "none";
                t.className = collapsed ? "toggle" : "toggle collapsed";
            };
        })(toggle, childHolder);

        line.appendChild(toggle);
        var keySpan = document.createElement("span");
        keySpan.className = "treeKey";
        if (!isRoot) {
            if (named) { keySpan.appendChild(markableText(key)); }
            else { keySpan.appendChild(document.createTextNode(key)); }
            keySpan.appendChild(document.createTextNode(": "));
        }
        keySpan.appendChild(document.createTextNode(sizeLabel(value)));
        line.appendChild(keySpan);
        wrap.appendChild(line);
        wrap.appendChild(childHolder);

        var keys = Array.isArray(value) ? null : Object.keys(value);
        var count = Array.isArray(value) ? value.length : keys.length;
        var limit = Array.isArray(value) ? Math.min(count, TREE_ARRAY_LIMIT) : count;

        var i;
        if (Array.isArray(value)) {
            for (i = 0; i < limit; i++) {
                childHolder.appendChild(buildTreeNode("[" + i + "]", value[i], false, false));
            }
            if (count > limit) {
                var more = document.createElement("div");
                more.className = "treeNode moreLink";
                more.textContent = fill(L("JsonViewerTreeMore"), { count: count - limit });
                more.onclick = (function (arr, holder, startAt) {
                    return function () {
                        for (var j = startAt; j < arr.length; j++) {
                            holder.insertBefore(buildTreeNode("[" + j + "]", arr[j], false, false), more);
                        }
                        more.parentNode.removeChild(more);
                    };
                })(value, childHolder, limit);
                childHolder.appendChild(more);
            }
        } else {
            for (i = 0; i < keys.length; i++) {
                childHolder.appendChild(buildTreeNode(keys[i], value[keys[i]], false, true));
            }
        }
    } else {
        var leafKey = document.createElement("span");
        leafKey.className = "treeKey";
        if (named) { leafKey.appendChild(markableText(key)); }
        else { leafKey.appendChild(document.createTextNode(key)); }
        leafKey.appendChild(document.createTextNode(": "));
        var leafVal = document.createElement("span");
        var cls = "treeVal ";
        if (typeof value === "string") { cls += "jstr"; }
        else if (typeof value === "number") { cls += "jnum"; }
        else if (typeof value === "boolean" || value === null) { cls += "jbool"; }
        leafVal.className = cls;
        if (typeof value === "string") {
            leafVal.appendChild(document.createTextNode("\""));
            leafVal.appendChild(markableText(value));
            leafVal.appendChild(document.createTextNode("\""));
        } else {
            leafVal.appendChild(markableText(String(value)));
        }
        line.appendChild(leafKey);
        line.appendChild(leafVal);
        wrap.appendChild(line);
    }

    return wrap;
}

// ---------- save as file ----------
function pad2(n) { return (n < 10 ? "0" : "") + n; }

function buildFilename(ext) {
    var d = new Date();
    var stamp = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
        "-" + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
    return "graph-" + stamp + "." + ext;
}

function saveTextAsFile(text, filename) {
    var blob = new Blob([text], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

// ---------- view toggle ----------
function showView(raw) {
    var oldCount = rawView ? matchLines.length : treeMatches.length;
    var oldAt = rawView ? currentMatch : treeCurrent;
    rawView = raw;
    document.getElementById("scrollArea").style.display = raw ? "block" : "none";
    document.getElementById("treeView").style.display = raw ? "none" : "block";
    var rawBtn = document.getElementById("btnRawView");
    var treeBtn = document.getElementById("btnTreeView");
    rawBtn.className = raw ? "ib on" : "ib";
    treeBtn.className = raw ? "ib" : "ib on";
    rawBtn.setAttribute("aria-pressed", raw ? "true" : "false");
    treeBtn.setAttribute("aria-pressed", raw ? "false" : "true");
    if (raw) { paintTreeText(); }
    runSearch(-1);
    var newCount = raw ? matchLines.length : treeMatches.length;
    if (newCount > 0 && newCount === oldCount && oldAt > 0) { gotoMatch(oldAt); }
}

// ---------- the menus of Copy and Save ----------
function closeMenus() {
    var menus = document.querySelectorAll(".menu");
    var buttons = document.querySelectorAll(".menuBtn");
    var i;
    for (i = 0; i < menus.length; i++) { menus[i].className = "menu"; }
    for (i = 0; i < buttons.length; i++) { buttons[i].setAttribute("aria-expanded", "false"); }
}

function toggleMenu(buttonId, menuId) {
    var menu = document.getElementById(menuId);
    var wasOpen = menu.className.indexOf("open") !== -1;
    closeMenus();
    if (!wasOpen) {
        menu.className = "menu open";
        document.getElementById(buttonId).setAttribute("aria-expanded", "true");
        var first = menu.querySelector("button");
        if (first) { first.focus(); }
    }
}

// ---------- what the app asks: its theme, and the search of its search bar ----------
// Only the window that holds this page may say so. A theme is one of two words. A search is a term and whether the case matters, or the
// number of a match to go to, or to stop; the page takes the term as text and never as HTML.
window.addEventListener("message", function (e) {
    if (e.source !== window.parent) { return; }
    var m = e.data;
    if (!m || m.type !== "graph-modeler-viewer") { return; }
    if (m.theme === "dark" || m.theme === "light") {
        document.documentElement.className = m.theme === "dark" ? "dark" : "";
    } else if (APP_SEARCH && m.action === "find" && typeof m.term === "string") {
        matchCase = m.matchCase === true;
        document.getElementById("searchInput").value = m.term;
        runSearch(-1);
    } else if (APP_SEARCH && m.action === "goto" && typeof m.index === "number") {
        gotoMatch(Math.floor(m.index));
    } else if (APP_SEARCH && m.action === "clear") {
        document.getElementById("searchInput").value = "";
        runSearch(-1);
    }
});

// The cursor goes to the search box with its text selected, so that typing replaces the term (as Ctrl+F does in the window around the page).
function focusSearch() {
    var box = document.getElementById("searchInput");
    box.focus();
    box.select();
}

// ---------- wire up events (no inline handlers, so this also works if a host sets a strict CSP) ----------
window.onload = function () {
    try { LABELS = JSON.parse(document.getElementById("labels").textContent) || {}; } catch (e) { LABELS = {}; }
    applyLabels();

    document.getElementById("btnSearch").onclick = function () { runSearch(-1); };
    document.getElementById("btnNext").onclick = nextMatch;
    document.getElementById("btnPrev").onclick = prevMatch;
    document.getElementById("btnClear").onclick = clearSearch;
    document.getElementById("btnCopy").onclick = function () { toggleMenu("btnCopy", "menuCopy"); };
    document.getElementById("btnSave").onclick = function () { toggleMenu("btnSave", "menuSave"); };
    document.getElementById("btnCopyRaw").onclick = function () { copyText(originalJson); closeMenus(); };
    document.getElementById("btnCopyPretty").onclick = function () { copyText(prettyJson); closeMenus(); };
    document.getElementById("btnSaveRaw").onclick = function () { saveTextAsFile(originalJson, buildFilename("json")); closeMenus(); };
    document.getElementById("btnSavePretty").onclick = function () { saveTextAsFile(prettyJson, buildFilename("json")); closeMenus(); };
    document.getElementById("btnHelp").onclick = function () {
        // The app opens the page; the page says only that it was asked for.
        window.parent.postMessage({ type: "graph-modeler-viewer", action: "help" }, "*");
    };
    document.getElementById("btnRawView").onclick = function () { showView(true); };
    document.getElementById("btnTreeView").onclick = function () { showView(false); };
    document.getElementById("searchInput").onkeydown = function (e) {
        e = e || window.event;
        if (e.keyCode === 13) {
            // Enter on a term that was already searched goes on to the next match (Shift+Enter, the one before); on a new term it searches.
            var searched = rawView ? currentTerm : treeTerm;
            var count = rawView ? matchLines.length : treeMatches.length;
            if (searched && searched === this.value && count > 0) { if (e.shiftKey) { prevMatch(); } else { nextMatch(); } }
            else { runSearch(-1); }
        }
    };
    document.addEventListener("click", function (e) {
        var t = e.target;
        if (!t || !t.closest || !t.closest(".menuWrap")) { closeMenus(); }
    });
    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { closeMenus(); }
        // Ctrl+F searches, F3 goes to the next match and Esc leaves the search, as in the other tabs. Key presses in this page do not reach
        // the app, so in the app the page asks it to do these (its search bar); on a website the page has a search box of its own.
        var find = (e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key && e.key.toLowerCase() === "f";
        var step = e.key === "F3" && !e.ctrlKey && !e.metaKey && !e.altKey;
        if (APP_SEARCH) {
            var asked = find ? "find" : step ? (e.shiftKey ? "previous" : "next") : e.key === "Escape" ? "close" : "";
            if (asked) { window.parent.postMessage({ type: "graph-modeler-viewer", action: "key", key: asked }, "*"); }
            if (find || step) { e.preventDefault(); }
        } else if (find) {
            focusSearch();
            e.preventDefault();
        } else if (step) {
            if (e.shiftKey) { prevMatch(); } else { nextMatch(); }
            e.preventDefault();
        }
    });
    document.getElementById("scrollArea").onscroll = renderVisibleRows;
    window.onresize = function () { renderVisibleRows(); };

    // The graph is in the page, as JSON text.
    var dataBlock = document.getElementById("graphData");
    var graphText = dataBlock ? dataBlock.textContent : "";
    var graph = null;
    try { graph = JSON.parse(graphText); } catch (e) { graph = null; }
    if (graph !== null) {
        loadJson(JSON.stringify(graph));
    } else {
        loadJson(graphText);
    }
};
</script>
</body>
</html>
